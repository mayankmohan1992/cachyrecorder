name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: pip install ruff

      - name: Byte-compile
        run: python -m compileall -q src/cachyrec

      - name: Ruff
        run: ruff check src/cachyrec --output-format=github

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # -S warning: SC2015 (A && B || C) is intentional throughout the
          # verify script's pass/fail reporting; it is an info-level note.
          shellcheck -S warning scripts/*.sh

      - name: Desktop entry is valid
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/cachyrecorder.desktop

      - name: No absolute home paths committed
        run: |
          if grep -rn '/home/[a-z]' --include='*.sh' --include='*.desktop' \
               --include='*.service' --include='*.py' . ; then
            echo "::error::hardcoded /home path found"
            exit 1
          fi

# NOTE: runtime behaviour (capture, OCR, tray registration) cannot be tested in
# CI — it needs a live KDE Plasma Wayland session. Those checks live in
# scripts/verify.sh and run on the maintainer's machine before merge
# via `make check`.
